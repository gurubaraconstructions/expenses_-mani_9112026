<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gurubara Owner Setup</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui,sans-serif;background:#f8fafc}.panel{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:22px}.field{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:11px}.btn{background:#f97316;color:white;border-radius:10px;padding:11px 15px;font-weight:700}</style></head><body class="min-h-screen grid place-items-center p-4"><main class="panel w-full max-w-md"><div class="text-2xl font-black">Gurubara Constructions</div><h1 class="text-lg font-bold mt-3">One-time owner setup</h1><p class="text-sm text-slate-500 mt-1">Use this page to create or reset the owner password. Keep the setup secret private and remove this page after setup.</p><form id="setup" class="space-y-3 mt-5"><label class="block text-sm font-semibold">Owner display name<input id="name" class="field mt-1" required></label><label class="block text-sm font-semibold">Owner password (minimum 6 characters)<input id="password" class="field mt-1" type="password" minlength="6" maxlength="128" value="978666" required></label><label class="block text-sm font-semibold">One-time setup secret<input id="secret" class="field mt-1" type="password" required></label><button class="btn w-full">Create owner account</button></form><p id="msg" class="text-sm mt-4"></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import {getFunctions,httpsCallable} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-functions.js';
const config={apiKey:'AIzaSyASxgYS-6YjqdYMqzLTsUcaNVZMMAqVb-Q',authDomain:'gurubaraexpense.firebaseapp.com',projectId:'gurubaraexpense',storageBucket:'gurubaraexpense.firebasestorage.app',messagingSenderId:'897431099760',appId:'1:897431099760:web:11343722967ad2b56757b5',measurementId:'G-2PCYD5PQHG'};
const app=initializeApp(config),fn=getFunctions(app,'asia-south1');
document.getElementById('setup').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Creating owner…';try{const call=httpsCallable(fn,'bootstrapOwner');const r=await call({displayName:document.getElementById('name').value.trim(),password:document.getElementById('password').value,setupSecret:document.getElementById('secret').value});msg.textContent=r.data.message+' Now delete bootstrap.html from your hosting project.';e.target.reset()}catch(err){msg.textContent=err.message||'Setup failed.'}});
</script></body></html>
